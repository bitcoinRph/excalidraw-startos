server {
    # no [::] listener — IPv6 may be disabled in the container runtime
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # scenes API sidecar (startos/api/server.mjs) — same origin as the app so
    # the in-app server-scenes integration needs no CORS
    location /api {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 64m;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
