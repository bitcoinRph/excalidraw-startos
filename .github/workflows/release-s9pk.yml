name: Release s9pk

# Build the StartOS package (.s9pk) and publish it as a GitHub release
# whenever the package changes on master. The release is keyed to the
# package version in startos/startos/versions/current.ts: bumping the
# version creates a new release; other package changes rebuild and
# refresh the assets of the release for the current version.

on:
  push:
    branches: ["master"]
    paths:
      - "startos/**"
      - "Dockerfile"
      - "excalidraw-app/**"
      - "packages/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: startos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        # start-cli s9pk pack needs both mksquashfs (squashfs-tools) and the -ng tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools squashfs-tools-ng

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resolve the latest start-cli/* release on Start9Labs/start-technologies —
      # the release series for the packing tool itself. Do NOT use the plain
      # v0.4.0-beta.* releases (those are other StartOS components; the CLI they
      # carry packs an older s9pk layout that current servers reject with
      # "file size is less than requested").
      - name: Install start-cli
        run: |
          url="$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Start9Labs/start-technologies/releases?per_page=20' \
            | jq -r '[.[] | select(.tag_name | startswith("start-cli/")) | .assets[] | select(.name == "start-cli_x86_64-linux") | .browser_download_url][0] // empty')"
          if [ -z "$url" ]; then
            echo "::error::Unable to find start-cli_x86_64-linux in Start9Labs/start-technologies start-cli releases"
            exit 1
          fi
          curl -fsSL "$url" -o /tmp/start-cli
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          start-cli --version

      # Sign with the repository's DEV_KEY secret when configured; otherwise
      # generate an ephemeral key (fine for sideloading).
      - name: Set up signing key
        run: |
          mkdir -p ~/.startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s' "$DEV_KEY" > ~/.startos/developer.key.pem
            cp ~/.startos/developer.key.pem ~/.startos/id.key.pem
          else
            start-cli init-key
          fi
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}

      # Current start-cli requires a packaging workspace in the parent of the
      # package directory; this provisions .startos/ (incl. the build key) at
      # the repo checkout root.
      - name: Initialize packaging workspace
        run: |
          start-cli s9pk init-workspace ..
          if [ -n "$DEV_KEY" ]; then
            printf '%s' "$DEV_KEY" > ../.startos/build.key.pem
          fi
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}

      - name: Install package dependencies
        run: npm ci

      - name: Build s9pks
        run: |
          make
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk | tee SHA256SUMS

      - name: Extract package version
        id: version
        run: |
          VERSION=$(start-cli -H http://localhost s9pk inspect excalidraw_x86_64.s9pk manifest | jq -r .version)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not extract version from the packed s9pk manifest"
            exit 1
          fi
          TAG="v${VERSION//:/_}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} -> Tag: ${TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Excalidraw ${{ steps.version.outputs.version }}
          body: |
            StartOS package for Excalidraw, version `${{ steps.version.outputs.version }}` (built from ${{ github.sha }}).
          
            Download the `.s9pk` for your server's architecture and sideload it via the StartOS web UI (System → Sideload a Service).
          files: |
            startos/*.s9pk
            startos/SHA256SUMS